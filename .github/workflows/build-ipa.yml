name: Build iOS IPA & Simulator (Jaras)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ensure XcodeGen is Installed
        run: which xcodegen || brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned Device Archive (IPA)
        run: |
          xcodebuild archive \
            -project Jaras.xcodeproj \
            -scheme Jaras \
            -configuration Release \
            -archivePath build/Jaras.xcarchive \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA for Sideloadly / AltStore
        run: |
          mkdir -p build/Payload
          cp -r build/Jaras.xcarchive/Products/Applications/Jaras.app build/Payload/
          cd build
          zip -r9 Jaras.ipa Payload

      - name: Build iOS Simulator App (for Appetize.io)
        run: |
          xcodebuild build \
            -project Jaras.xcodeproj \
            -scheme Jaras \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          cd build/sim/Build/Products/Release-iphonesimulator
          zip -r9 ../../../../Jaras-Simulator.zip Jaras.app

      - name: Upload Jaras.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jaras-iOS-IPA
          path: build/Jaras.ipa

      - name: Upload Jaras-Simulator.zip Artifact (Appetize.io)
        uses: actions/upload-artifact@v4
        with:
          name: Jaras-iOS-Simulator
          path: build/Jaras-Simulator.zip
